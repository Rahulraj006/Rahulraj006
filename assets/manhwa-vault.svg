<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="100%" height="100%">
  <defs>
    <linearGradient id="vaultBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090C16"/>
      <stop offset="100%" stop-color="#05070D"/>
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141B2D"/>
      <stop offset="100%" stop-color="#0D121F"/>
    </linearGradient>

    <style>
      @keyframes badgePulse {
        0%, 100% { opacity: 0.8; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.02); }
      }
      .card-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-weight: 800;
        font-size: 13.5px;
        fill: #FFFFFF;
      }
      .card-tag {
        font-family: monospace;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .card-desc {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 11px;
        fill: #94A3B8;
        line-height: 1.4;
      }
    </style>
  </defs>

  <rect width="836" height="216" x="2" y="2" rx="14" fill="url(#vaultBg)" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Top Bar -->
  <g transform="translate(36, 26)">
    <text x="0" y="0" font-family="monospace" font-size="11.5" font-weight="800" fill="#00F0FF" letter-spacing="2">
      ARCHIVE // 10,000+ MANHWA CHAPTERS INGESTED
    </text>
    <text x="764" y="0" text-anchor="end" font-family="sans-serif" font-size="11" fill="#64748B">
      Narrative Strategy • Pacing • Psychological Warfare
    </text>
  </g>

  <!-- 3 Manhwa Archetype Cards -->
  <!-- Card 1: Omniscient Reader / Strategy -->
  <g transform="translate(36, 50)">
    <rect width="240" height="140" rx="10" fill="url(#cardGrad1)" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.4"/>
    <text x="18" y="28" class="card-tag" fill="#00F0FF">[ TACTICAL / META ]</text>
    <text x="18" y="52" class="card-title">Omniscient Strategist</text>
    <text x="18" y="78" class="card-desc">Understanding the end before the</text>
    <text x="18" y="96" class="card-desc">story begins. Reading market &amp; human</text>
    <text x="18" y="114" class="card-desc">patterns with relentless foresight.</text>
  </g>

  <!-- Card 2: Murim / Relentless Discipline -->
  <g transform="translate(298, 50)">
    <rect width="240" height="140" rx="10" fill="url(#cardGrad1)" stroke="#A855F7" stroke-width="1" stroke-opacity="0.4"/>
    <text x="18" y="28" class="card-tag" fill="#A855F7">[ MURIM / UNBENDING ]</text>
    <text x="18" y="52" class="card-title">Northern Blade Mindset</text>
    <text x="18" y="78" class="card-desc">Patience in obscurity, explosive</text>
    <text x="18" y="96" class="card-desc">execution in daylight. Unfazed by</text>
    <text x="18" y="114" class="card-desc">critics who have never swung a blade.</text>
  </g>

  <!-- Card 3: Estate Developer / Commercial Hustle -->
  <g transform="translate(560, 50)">
    <rect width="240" height="140" rx="10" fill="url(#cardGrad1)" stroke="#FF0055" stroke-width="1" stroke-opacity="0.4"/>
    <text x="18" y="28" class="card-tag" fill="#FF0055">[ VENTURE / LEVERAGE ]</text>
    <text x="18" y="52" class="card-title">Ruthless Deal Architecture</text>
    <text x="18" y="78" class="card-desc">Turning desolate terrain into prime</text>
    <text x="18" y="96" class="card-desc">real estate. Aligning incentives,</text>
    <text x="18" y="114" class="card-desc">cracking negotiations, taking the bag.</text>
  </g>
</svg>
