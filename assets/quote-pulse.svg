<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 110" width="100%" height="100%">
  <defs>
    <linearGradient id="quoteTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#FF9966"/>
    </linearGradient>

    <style>
      @keyframes softPulse {
        0%, 100% { opacity: 0.85; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.008); }
      }
      .quote-content {
        font-family: 'Georgia', -apple-system, serif;
        font-style: italic;
        font-size: 19px;
        fill: #F8FAFC;
        letter-spacing: 0.2px;
      }
      .quote-author {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 12px;
        font-weight: 700;
        fill: #FF9966;
        letter-spacing: 1.5px;
      }
    </style>
  </defs>

  <rect width="838" height="108" x="1" y="1" rx="14" fill="#090B10" stroke="#1E2330" stroke-width="1.2"/>
  
  <!-- Left Accent Bar with Animated Pulse -->
  <rect x="25" y="24" width="4" height="60" rx="2" fill="#FF5E62">
    <animate attributeName="fill" values="#FF5E62;#9D4EDD;#FF5E62" dur="6s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(48, 50)">
    <text x="0" y="0" class="quote-content">
      “Features can be copied. Taste, timing, and trust cannot.”
    </text>
    <text x="0" y="26" class="quote-author">
      — RAHUL RAJ • CIT CHENNAI
    </text>
  </g>
</svg>
