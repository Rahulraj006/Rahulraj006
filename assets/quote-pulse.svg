<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 120" width="100%" height="100%">
  <defs>
    <linearGradient id="quoteBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#7000FF"/>
      <stop offset="100%" stop-color="#FF0055"/>
    </linearGradient>

    <style>
      .quote-main {
        font-family: 'Georgia', -apple-system, serif;
        font-style: italic;
        font-size: 17.5px;
        fill: #F8FAFC;
        letter-spacing: 0.2px;
      }
      .quote-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
        font-size: 11.5px;
        font-weight: 700;
        fill: #00F0FF;
        letter-spacing: 1.5px;
      }
    </style>
  </defs>

  <rect width="836" height="116" x="2" y="2" rx="12" fill="#080C16" stroke="#1E293B" stroke-width="1.2"/>
  
  <!-- Left Accent Bar -->
  <rect x="24" y="22" width="4" height="72" rx="2" fill="url(#quoteBar)"/>

  <g transform="translate(46, 52)">
    <text x="0" y="0" class="quote-main">
      “Criticism is merely unrefined truth. Bring your strongest counter-thesis —
    </text>
    <text x="0" y="24" class="quote-main">
      consensus builds nothing legendary. Steel sharpens steel.”
    </text>
    <text x="0" y="50" class="quote-sub">
      — RAHUL RAJ // THE DEBATE FLOOR
    </text>
  </g>
</svg>
