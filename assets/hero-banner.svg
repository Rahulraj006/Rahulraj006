<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090F"/>
      <stop offset="50%" stop-color="#0C101C"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF">
        <animate attributeName="stop-color" values="#00F0FF;#A855F7;#FF007A;#00F0FF" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#A855F7">
        <animate attributeName="stop-color" values="#A855F7;#FF007A;#00F0FF;#A855F7" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FF007A">
        <animate attributeName="stop-color" values="#FF007A;#00F0FF;#A855F7;#FF007A" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="textShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <radialGradient id="meshGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.18">
        <animate attributeName="stop-opacity" values="0.18;0.32;0.18" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="60%" stop-color="#7000FF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#07090F" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      @keyframes particleFloat {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
        50% { transform: translateY(-15px) translateX(8px); opacity: 0.8; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      }
      .headline {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 900;
        font-size: 44px;
        letter-spacing: -0.5px;
      }
      .tagline {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 700;
        font-size: 13.5px;
        letter-spacing: 2.5px;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 600;
        font-size: 11.5px;
        letter-spacing: 0.5px;
      }
      .p1 { animation: particleFloat 6s ease-in-out infinite; }
      .p2 { animation: particleFloat 8s ease-in-out infinite 1.5s; }
      .p3 { animation: particleFloat 7s ease-in-out infinite 3s; }
      .live-dot { animation: blink 2s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="838" height="258" x="1" y="1" rx="16" fill="url(#bgGrad)" stroke="#1F293D" stroke-width="1.2"/>
  <rect width="838" height="258" x="1" y="1" rx="16" fill="url(#meshGlow)"/>

  <!-- Ambient Floating Aura Particles -->
  <circle class="p1" cx="120" cy="80" r="2.5" fill="#00F0FF"/>
  <circle class="p2" cx="720" cy="70" r="3" fill="#A855F7"/>
  <circle class="p3" cx="650" cy="190" r="2" fill="#FF007A"/>
  <circle class="p1" cx="210" cy="180" r="2.2" fill="#00F0FF"/>

  <!-- Tech Lines -->
  <line x1="60" y1="40" x2="780" y2="40" stroke="#00F0FF" stroke-opacity="0.08" stroke-dasharray="4,6"/>
  <line x1="60" y1="220" x2="780" y2="220" stroke="#00F0FF" stroke-opacity="0.08" stroke-dasharray="4,6"/>

  <!-- Top Right Manhwa Rank Badges -->
  <g transform="translate(580, 24)">
    <rect width="200" height="26" rx="6" fill="#0C1322" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.6"/>
    <circle class="live-dot" cx="16" cy="13" r="4.5" fill="#00F0FF" filter="url(#glow)"/>
    <text x="30" y="17" fill="#E2E8F0" class="pill-text" font-weight="700">SSS-RANK SOVEREIGN</text>
  </g>

  <!-- Main Name / Identity -->
  <g transform="translate(60, 105)">
    <text x="0" y="0" class="headline" fill="url(#textShine)">RAHUL RAJ</text>
    <circle cx="280" cy="-12" r="6" fill="url(#accentGrad)" filter="url(#glow)"/>
  </g>

  <!-- Tagline / Mission -->
  <g transform="translate(60, 142)">
    <text x="0" y="0" class="tagline" fill="url(#accentGrad)">
      IDEAS WITH TASTE • UNFORGIVING IN DEBATE • BUSINESS WITH A PULSE
    </text>
  </g>

  <!-- Interactive Pill Tags (Pillars) -->
  <g transform="translate(60, 176)">
    <!-- Pill 1: Dialectic / Debate -->
    <g transform="translate(0, 0)">
      <rect width="172" height="32" rx="8" fill="#13101C" stroke="#FF0055" stroke-width="1" stroke-opacity="0.6"/>
      <text x="14" y="20" fill="#FECDD3" class="pill-text">⚔️ Dialectic Combat</text>
    </g>

    <!-- Pill 2: Taste & Design -->
    <g transform="translate(184, 0)">
      <rect width="172" height="32" rx="8" fill="#111827" stroke="#A855F7" stroke-width="1" stroke-opacity="0.6"/>
      <text x="14" y="20" fill="#E9D5FF" class="pill-text">🎨 High-Aura Design</text>
    </g>

    <!-- Pill 3: Venture / People -->
    <g transform="translate(368, 0)">
      <rect width="176" height="32" rx="8" fill="#0B1322" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.6"/>
      <text x="14" y="20" fill="#BAE6FD" class="pill-text">🤝 Relationship Capital</text>
    </g>

    <!-- Pill 4: Manhwa Repertoire -->
    <g transform="translate(556, 0)">
      <rect width="168" height="32" rx="8" fill="#0B1917" stroke="#00E676" stroke-width="1" stroke-opacity="0.5"/>
      <text x="14" y="20" fill="#D1FAE5" class="pill-text">📖 Top 0.01% Reader</text>
    </g>
  </g>
</svg>
