<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 14" width="100%" height="100%">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5E62" stop-opacity="0"/>
      <stop offset="25%" stop-color="#FF5E62" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FF9966" stop-opacity="1">
        <animate attributeName="stop-color" values="#FF9966;#9D4EDD;#00E676;#FF9966" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="75%" stop-color="#9D4EDD" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#9D4EDD" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="20" y="5" width="800" height="2.5" rx="1.25" fill="url(#divGrad)"/>
  <circle cx="420" cy="6" r="3.5" fill="#FFFFFF">
    <animate attributeName="r" values="2.5;4.5;2.5" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
